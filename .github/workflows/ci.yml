name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - sesi30-devsecops
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: notes-app-devsecops

jobs:

  # JOB 1 - UNIT TEST
  unit_test:
    name: Unit Test - Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r dev-requirements.txt

      - name: Run Unit Test
        run: python -m pytest -v


  # JOB 2 - SAST
  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt

      - name: Run Bandit
        run: bandit -r app -ll


  # JOB 3 - SCA
  sca:
    name: SCA - Pip Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pip Audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Production Dependencies
        run: pip-audit -r requirements.txt

      - name: Audit Development Dependencies
        run: pip-audit -r dev-requirements.txt


  # JOB 4 - SECRET SCAN
  secret_scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # JOB 5 - BUILD AND PUSH
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - unit_test
      - sast
      - sca
      - secret_scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


  # JOB 6 - IMAGE SCAN
  image_scan:
    name: Image Scan - Trivy
    runs-on: ubuntu-latest

    needs:
      - build_and_push

    steps:
      - name: Scan Docker Hub Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'